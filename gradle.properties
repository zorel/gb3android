org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Let AGP install missing SDK components when the SDK root exists and the
# Android SDK licences have already been accepted. This does not bootstrap an
# entirely missing SDK; use scripts/install-android-sdk.sh for that.
android.builder.sdkDownload=true

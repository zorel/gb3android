name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build release APK
        id: release
        env:
          KEYSTORE_BASE64: ${{ secrets.GB3_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GB3_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GB3_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GB3_RELEASE_KEY_PASSWORD }}
        run: |
          signing=debug-key
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export GB3_RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks"
            export GB3_RELEASE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            export GB3_RELEASE_KEY_ALIAS="$KEY_ALIAS"
            export GB3_RELEASE_KEY_PASSWORD="$KEY_PASSWORD"
            signing=release-key
          else
            echo "::warning::No GB3_RELEASE_KEYSTORE_BASE64 secret; the release APK will use the debug key."
            {
              echo "> [!WARNING]"
              echo "> No release keystore configured: this APK is signed with the debug key and must not be published."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          ./gradlew :app:assembleRelease --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: gb3-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: gb3-android-release-${{ steps.release.outputs.signing }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

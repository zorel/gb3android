name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and attach release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.GB3_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GB3_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GB3_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GB3_RELEASE_KEY_PASSWORD }}
        run: |
          missing=
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name; release APKs must be signed."
              missing=1
            fi
          done
          if [ -n "$missing" ]; then
            echo "Configure GB3_RELEASE_KEYSTORE_BASE64, GB3_RELEASE_KEYSTORE_PASSWORD, GB3_RELEASE_KEY_ALIAS and GB3_RELEASE_KEY_PASSWORD."
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GB3_RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          GB3_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          GB3_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GB3_RELEASE_KEYSTORE_PASSWORD }}
          GB3_RELEASE_KEY_ALIAS: ${{ secrets.GB3_RELEASE_KEY_ALIAS }}
          GB3_RELEASE_KEY_PASSWORD: ${{ secrets.GB3_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk'

      - name: Attach APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          asset="gb3android-${TAG//\//-}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          gh release upload "$TAG" "$asset" --clobber

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: gb3-android-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
